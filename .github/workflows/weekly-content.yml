name: Weekly Content Generation

on:
  schedule:
    - cron: '0 10 * * 3'   # Wednesday 10:00 UTC
    - cron: '0 10 * * 5'   # Friday 10:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of articles to generate (use 999 for all pending)'
        default: '2'
      tier:
        description: 'Tier filter (1, 2, 3, or leave empty for all)'
        default: ''

permissions:
  contents: write

jobs:
  generate-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate articles
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          LIMIT=${{ github.event.inputs.limit || '2' }}
          TIER=${{ github.event.inputs.tier || '' }}
          if [ -n "$TIER" ]; then
            node scripts/generate-batch.mjs --limit $LIMIT --tier $TIER
          else
            node scripts/generate-batch.mjs --limit $LIMIT
          fi

      - name: Run post-publish pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/post-publish.mjs
